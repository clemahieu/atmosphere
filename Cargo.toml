[workspace]
resolver = "2"
members = [
  "aelf",
  "aloader",
  "astd",
  "asys",
  "atest",
  "build-tool",
  "dom0",
  "kernel-logger",
  "ns16550a",
  "kernel",
  "kernel/verified",
  "redhttpd",
  "ring_buffer",
  "user/hello",
  "user/maglev",
  "user/kv",
  "e810_driver",

  #"test-cargo-driver",
  #"atcp",
  #"build-tool",
  #"kernel",
  #"libcap",
  #"portman",
  #"verified",
]

exclude = ["test-pass", "tools/verus"]

# Unoptimized, the kernel moves its large objects by value through stack frames over a gigabyte
# deep, far past its boot stack. This level removes the worst of them and keeps the debug assertions
# and overflow checks.
[profile.dev]
opt-level = 1

[profile.release]
debug = true
