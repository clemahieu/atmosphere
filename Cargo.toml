[workspace]
resolver = "2"
members = [
  "aelf",
  "aloader",
  "astd",
  "asys",
  "atest",
  "build-tool",
  "dom0",
  "kernel-logger",
  "machine/pc",
  "machine/virt",
  "ns16550a",
  "kernel",
  "kernel/verified",
  "user/hello",
  "file-service",
  "aring",
  "amailbox",
  "afanin",
  "pager-policy",
  "adivider",
]

exclude = ["test-pass", "tools/verus"]

[workspace.package]
license = "MIT"

# The Verus every verified crate builds against, and the commit tools/setup-verus.sh builds.
[workspace.dependencies.vstd]
git = "https://github.com/verus-lang/verus"
rev = "09464f0f7f5e545c2f2fe328437ebf8f968e263e"
default-features = false

[profile.release]
debug = true
