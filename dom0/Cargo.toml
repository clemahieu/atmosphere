[package]
name = "dom0"
version = "0.1.0"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
astd = { path = "../astd" }
asys = { path = "../asys" }
pcid = { path = "../pcid" }
ring_buffer = { path = "../ring_buffer" }

libtime = { path = "../user/libtime" }
constants = { path = "../constants" }

slabmalloc = "0.11.0"
spin = "0.9.8"
log = "0.4.19"
x86 = "0.52.0"
lazy_static = { version = "1.4.0", features = ["spin_no_std"] }

[features]
# Run the capability kernel's dom0 instead of the old one, on the cut-over branch only; see
# design/cut-over-on-a-branch/.
capability = []
