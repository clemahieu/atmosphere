[package]
name = "dom0"
version = "0.1.0"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
acall = { path = "../acall" }
aeager = { path = "../aeager" }
aheap = { path = "../aheap" }
astd = { path = "../astd", features = ["heap"] }
asys = { path = "../asys" }

[dependencies.vstd]
workspace = true

# A freestanding binary with its own panic handler: it has no host tests, and cargo test builds no
# harness for it.
[[bin]]
name = "dom0"
path = "src/main.rs"
test = false
