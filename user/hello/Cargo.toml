[package]
name = "hello"
version = "0.1.0"
edition = "2021"
license.workspace = true

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
asys = { path = "../../asys" }

# A freestanding binary with its own panic handler: it has no host tests, and cargo test builds no
# harness for it.
[[bin]]
name = "hello"
path = "src/main.rs"
test = false
