[build]
target = "src/x86_64-unknown-aloader.json"
rustflags = [ "-Z", "emit-stack-sizes" ]

[target.x86_64-unknown-aloader]
runner = [ "atmo", "run", "--cargo-runner" ]

[unstable]
build-std = [ "core" ]
build-std-features = [ "compiler-builtins-mem" ]
unstable-options = true
json-target-spec = true

# Rust 1.99.1 is a stable compiler: unlock -Z flags, build-std and #![feature].
[env]
RUSTC_BOOTSTRAP = "1"
