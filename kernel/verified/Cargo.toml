[package]
name = "verified"
version = "0.1.0"
edition = "2021"
license.workspace = true

[package.metadata.atmosphere]
verified = true

[lib]
name = "verified"
path = "lib.rs"
# Its doc examples are Verus source, which rustdoc cannot compile.
doctest = false

[dependencies.vstd]
workspace = true

# Cannot have any other dependencies

[features]
std = []

# rust_verify sets verus_keep_ghost; a cargo build does not, and the verus! macro then erases
# specifications and proofs, so items only they use are compiled under this cfg alone.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(verus_keep_ghost)"] }
