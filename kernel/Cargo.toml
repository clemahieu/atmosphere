[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[target.'cfg(target_arch = "x86_64")'.dependencies]
machine-pc = { path = "../machine/pc" }

[target.'cfg(target_arch = "aarch64")'.dependencies]
machine-virt = { path = "../machine/virt" }

[dependencies]
astd = { path = "../astd", features = ["kernel"] }
asys = { path = "../asys" }
atest = { path = "../atest" }
kernel-logger = { path = "../kernel-logger" }

bitfield = "0.13.2"  # Totally non-confusing crate name
bit_field = "0.10.1"
displaydoc = { version = "0.2.3", default-features = false }
log = "0.4.14"
memoffset = { version = "0.9.0", features = ["unstable_const", "unstable_offset_of"] }

[dependencies.verified]
path = "verified"

[dependencies.vstd]
git = "https://github.com/verus-lang/verus"
rev = "3e8600ac3a52238dcf581a91c761e160bb6da743"
default-features = false

[features]
# Time every hold of a lock and every wait for one, reported in the serial log.
lock_stats = []
# A syscall stack shallower than a syscall, so tools/check-boot-stack.py can force it to overflow.
small_syscall_stack = []
