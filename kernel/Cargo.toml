[package]
name = "kernel"
version = "0.1.0"
edition = "2021"
license.workspace = true
publish = false

[target.'cfg(target_arch = "x86_64")'.dependencies]
machine-pc = { path = "../machine/pc" }
asys = { path = "../asys" }
bit_field = "0.10.1"

[target.'cfg(target_arch = "aarch64")'.dependencies]
machine-virt = { path = "../machine/virt" }

[dependencies]
astd = { path = "../astd", features = ["kernel"] }
kernel-logger = { path = "../kernel-logger" }

log = "0.4.14"

[dependencies.verified]
path = "verified"

[dependencies.vstd]
workspace = true

[features]
# Time every hold of a lock and every wait for one, reported in the serial log.
lock_stats = []
# A syscall stack shallower than a syscall, so tools/check-boot-stack.py can force it to overflow.
small_syscall_stack = []
# CPU 0 arms its timer as it enters dom0, which nothing waits for, so tools/check-stray-timer.py can
# check that the core reports the stray interrupt and stops.
stray_timer = []
# CPU 0 panics once its command line is read, so tools/check-boot-panic.py can check that a panic
# ends the run with a failure.
boot_panic = []

# A freestanding binary with its own panic handler: it has no host tests, and cargo test builds no
# harness for it.
[[bin]]
name = "kernel"
path = "src/main.rs"
test = false
